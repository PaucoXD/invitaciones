<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Muestra una invitación.
    invitacion.html                         → boda de ejemplo
    invitacion.html?b=valeria-santiago      → carga bodas/valeria-santiago.js
    invitacion.html?plantilla=boho          → cambia la plantilla
    invitacion.html?plantilla=princesa      → XV años de ejemplo (princesa, mariposas, gala)
    invitacion.html?plantilla=nube&evento=bautizo → ejemplo de otro tipo de evento
    &invitado=Familia%20López&pases=4       → personaliza para cada invitado
-->
<script src="motor/invitacion.js"></script>
<script src="motor/lib/qrcode-fuente.js"></script>
<script src="plantillas/floral.js"></script>
<script src="plantillas/rustica.js"></script>
<script src="plantillas/boho.js"></script>
<script src="plantillas/dorada.js"></script>
<script src="plantillas/vino.js"></script>
<script src="plantillas/botanica.js"></script>
<script src="plantillas/xv-princesa.js"></script>
<script src="plantillas/xv-mariposas.js"></script>
<script src="plantillas/xv-gala.js"></script>
<script src="plantillas/nube.js"></script>
<script src="plantillas/paloma.js"></script>
<script src="plantillas/caliz.js"></script>
<script src="plantillas/globos.js"></script>
<script src="plantillas/confeti.js"></script>
<script src="bodas/ejemplo.js"></script>
<script src="bodas/ejemplo-xv.js"></script>
<script src="bodas/ejemplos-eventos.js"></script>
</head>
<body>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var preview = q.has('preview');
  var opciones = { sinSobre: q.has('sinSobre'), sinAnim: preview, aparta: q.has('aparta') };

  function mostrar(datos) {
    if (q.get('plantilla')) datos = Object.assign({}, datos, { plantilla: q.get('plantilla') });
    Invitacion.montar(datos, opciones);
  }

  // Vista previa del editor: recibe los datos por mensaje
  if (preview) {
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.tipo !== 'invitacion') return;
      var y = window.scrollY;
      opciones.sinSobre = !e.data.conSobre; opciones.aparta = !!e.data.aparta;
      mostrar(e.data.prueba ? Object.assign({}, e.data.datos, { _prueba: e.data.prueba }) : e.data.datos);
      window.scrollTo(0, y);
    });
    parent.postMessage({ tipo: 'lista' }, '*');
  }

  var slug = (q.get('b') || '').replace(/[^a-z0-9_-]/gi, '');
  var folio = (q.get('pedido') || '').replace(/[^\w-]/g, '');
  function aviso(t, ok) { document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:80px auto;padding:24px;text-align:center;color:#2b241f">' + (ok ? '<div style="width:38px;height:38px;margin:0 auto 14px;border:3px solid #e6dccf;border-top-color:#8e3b4a;border-radius:50%;animation:g 1s linear infinite"></div><style>@keyframes g{to{transform:rotate(360deg)}}</style>' : '') + '<p>' + t + '</p></div>'; }
  if (folio) {
    // Vista de un pedido del formulario (desde Mis bodas): usa la sesión de administrador de este navegador
    var ses = {}; try { ses = JSON.parse(localStorage.getItem('mis-bodas-admin')) || {}; } catch (e) {}
    var url = ses.url || (window.NEGOCIO && NEGOCIO.hojaConfirmaciones) || '';
    if (!url || !ses.clave) aviso('Para ver pedidos entra primero a <b>Mis bodas</b> en este navegador.');
    else {
      aviso('Cargando la invitación del pedido ' + folio + '…<br><small style="color:#756b61">Con fotos puede tardar unos segundos.</small>', true);
      var base = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'accion=pedido&id=' + encodeURIComponent(folio) + '&clave=' + encodeURIComponent(ses.clave);
      (async function () {
        var pg = {};
        try { pg = await (await fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + 'accion=ping&t=' + Date.now(), { cache: 'no-store' })).json(); } catch (e) {}
        if (pg.version && pg.version < 10) throw new Error('tu Google todavía usa el código versión ' + pg.version + '. Actualízalo a la versión 10 (manual, sección 3.0).');
        // Por pedazos; si Google rechaza uno, se pide a la mitad del tamaño
        var tam = 200000, desde = 0, total = Infinity, texto = '', fallos = 0;
        while (desde < total) {
          var r = null;
          try { r = JSON.parse(await (await fetch(base + '&desde=' + desde + '&tam=' + tam + '&t=' + Date.now(), { cache: 'no-store' })).text()); } catch (e) { r = null; }
          if (r && !r.ok) throw new Error(r.error || 'error');
          if (r && r.pedido) return r.pedido;
          if (!r || r.total == null) {
            if (++fallos > 8) throw new Error('Google no pudo mandar el pedido. Plan B: en Mis bodas toca “⬇ Archivo” y ábrelo en el editor con 📂 Abrir.');
            tam = Math.max(20000, Math.floor(tam / 2));
            await new Promise(function (ok) { setTimeout(ok, 600); });
            continue;
          }
          total = r.total; texto += r.texto; desde += r.texto.length; fallos = 0;
          if (!r.texto.length) break;
          aviso('Cargando la invitación del pedido ' + folio + '…<br><small style="color:#756b61">Descargando fotos… ' + Math.round(Math.min(desde, total) / total * 100) + '%</small>', true);
        }
        return JSON.parse(texto);
      })().then(function (p) { mostrar(p.datos); })
        .catch(function (e) { aviso('No se pudo cargar el pedido: ' + (e.message || 'sin conexión') + '<br><br><a href="" style="color:#8e3b4a">Reintentar</a>'); });
    }
  } else if (slug) {
    var s = document.createElement('script');
    s.src = 'bodas/' + slug + '.js';
    s.onload = function () { mostrar(window.INVITACION); };
    s.onerror = function () { document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px;text-align:center">No se encontró la invitación “' + slug + '”.</p>'; };
    document.head.appendChild(s);
  } else {
    // Ejemplo según el tipo de evento (?evento=bautizo) o el primero del diseño elegido
    var pl = Invitacion.plantillas[q.get('plantilla')];
    var ev = q.get('evento') || (pl && pl.eventos && pl.eventos[0]) || 'boda';
    if (pl && pl.eventos && pl.eventos.indexOf(ev) < 0) ev = pl.eventos[0];
    mostrar(window.ejemploDe ? window.ejemploDe(ev) || window.INVITACION : window.INVITACION);
  }
})();
</script>
</body>
</html>
