<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2b1a1e">
<title>Datos para tu invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Formulario para que el cliente llene los datos de su invitación.
  Se manda a tu Google Sheets (si pusiste hojaConfirmaciones en negocio.js) y aparece en "Mis bodas".
  Enlaces útiles:  pedido.html            pedido.html?evento=xv (o bautizo, comunion, babyshower, cumple)            pedido.html?plantilla=gala&paquete=Premium
-->
<script src="negocio.js" onerror="window.NEGOCIO={}"></script>
<script src="motor/invitacion.js"></script>
<script src="plantillas/floral.js"></script>
<script src="plantillas/rustica.js"></script>
<script src="plantillas/boho.js"></script>
<script src="plantillas/dorada.js"></script>
<script src="plantillas/vino.js"></script>
<script src="plantillas/botanica.js"></script>
<script src="plantillas/xv-princesa.js"></script>
<script src="plantillas/xv-mariposas.js"></script>
<script src="plantillas/xv-gala.js"></script>
<script src="plantillas/nube.js"></script>
<script src="plantillas/paloma.js"></script>
<script src="plantillas/caliz.js"></script>
<script src="plantillas/globos.js"></script>
<script src="plantillas/confeti.js"></script>
<style>
  :root{--bg:#faf6f1;--card:#fff;--ink:#2e2721;--muted:#6f655b;--line:#e6dccf;--accent:#8e3b4a;--accent-bg:#f6eaec;--ok:#3f7a52;--ok-bg:#e8f3eb;--no:#a9473e;--no-bg:#f8e9e7;--dark:#2b1a1e;--serif:'Cormorant Garamond',Georgia,serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  :where(a,button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .top{background:var(--dark);color:#f4e9e2;padding:14px 16px}
  .top .w{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .top b{font-family:var(--serif);font-size:22px;font-weight:600;margin-right:auto}
  .top small{font-size:13px;color:#d9c6bd}
  .avance{height:5px;background:#efe6dc}.avance i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
  main{max-width:720px;margin:0 auto;padding:22px 16px 120px}
  .paso-n{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 6px}
  .intro{color:var(--muted);margin-bottom:20px}
  .caja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .caja h2{font-size:15px;font-weight:600;margin-bottom:4px}
  .caja>.ayuda:first-of-type{margin-top:0}
  label.c{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
  label.c:first-child{margin-top:0}
  label.c small{font-weight:400;color:var(--muted)}
  .req{color:var(--no)}
  input[type=text],input[type=tel],input[type=date],input[type=time],input[type=url],input[type=number],select,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fdfbf8;font-size:16px;min-height:48px}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(142,59,74,.15);outline:none}
  textarea{min-height:110px;resize:vertical}
  .ayuda{font-size:13.5px;color:var(--muted);margin-top:6px}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fila>div>label.c{margin-top:14px}
  .opc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .opc label{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:600;min-height:56px;text-align:center}
  .opc input{position:absolute;opacity:0;pointer-events:none}
  .opc input:checked+label{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .opc input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
  .disenos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .dis{position:relative}
  .dis input{position:absolute;opacity:0;pointer-events:none}
  .dis label{display:block;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--card);cursor:pointer;height:100%}
  .dis input:checked+label{border-color:var(--accent);box-shadow:0 0 0 3px rgba(142,59,74,.15)}
  .dis input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
  .dis .sw{display:flex;height:28px;border-radius:7px;overflow:hidden;margin-bottom:8px}.dis .sw span{flex:1}
  .dis b{display:block;font-size:14px}
  .dis a{display:inline-block;margin-top:4px;font-size:13px;color:var(--accent);padding:4px 0}
  .lista-it .it{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;margin-bottom:8px}
  .quitar{border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:18px;color:var(--muted);min-height:48px}
  .mas{border:1px dashed var(--accent);background:none;color:var(--accent);padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:600;min-height:46px}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
  .foto{position:relative;border-radius:12px;overflow:hidden;background:#efe7dd;aspect-ratio:3/4}
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto input{position:absolute;left:6px;right:6px;bottom:6px;width:auto;min-height:36px;padding:6px 8px;font-size:13px;background:rgba(255,255,255,.92)}
  .foto .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:18px}
  .subir{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:12px;padding:18px;cursor:pointer;color:var(--muted);text-align:center;background:#fdfbf8;min-height:120px}
  .subir:hover{border-color:var(--accent);color:var(--accent)}
  .portada-prev{max-width:220px}
  .cuenta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .pill{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--ok-bg);color:var(--ok);font-weight:600}
  .pill.mal{background:var(--no-bg);color:var(--no)}
  .nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,246,241,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .nav .w{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .nav .guardado{font-size:12.5px;color:var(--muted);margin-right:auto}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;text-decoration:none;min-height:50px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.wa{background:#198644;border-color:#198644;color:#fff}
  .btn:disabled{opacity:.55;cursor:wait}
  .error{background:var(--no-bg);color:var(--no);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
  .resumen dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14.5px}
  .resumen dt{color:var(--muted)}
  .resumen dd{white-space:pre-line;word-break:break-word}
  .resumen .ed{float:right;font-size:13px;color:var(--accent);background:none;border:none;cursor:pointer;font-weight:600;padding:6px}
  .previa{border-radius:28px;border:8px solid #1e1b18;overflow:hidden;width:min(320px,100%);aspect-ratio:9/17;margin:0 auto;background:#eee}
  .previa iframe{width:100%;height:100%;border:0}
  .listo{text-align:center;padding:30px 10px}
  .pago{text-align:left;margin-top:22px}
  .pago h2{margin-bottom:4px}
  .pago .monto{font-size:28px;font-weight:700;color:var(--accent);margin:4px 0 2px}
  .pago dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:10px 0;font-size:15px}
  .pago dt{color:var(--muted)}.pago dd{font-weight:600;word-break:break-all}
  .pago .opcion{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
  .pago .btn{width:100%;margin-top:8px}
  .pago .estado{margin-top:10px;font-size:14px}.pago .estado.ok{color:var(--ok)}.pago .estado.mal{color:var(--no)}
  .btn.mp{background:#009ee3;border-color:#009ee3;color:#fff}
  .listo .ico{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:36px}
  .listo .folio{display:inline-block;margin:10px 0;padding:8px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:600;letter-spacing:.05em}
  .acciones{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:18px auto 0}
  @media (max-width:560px){.fila{grid-template-columns:1fr}.fila>div>label.c{margin-top:14px}.resumen dl{grid-template-columns:1fr}.resumen dt{margin-top:6px}h1{font-size:30px}}
</style>
</head>
<body>
<header class="top"><div class="w"><b id="marca">Tu invitación</b><small id="paso-txt"></small></div></header>
<div class="avance"><i id="barra" style="width:0"></i></div>
<main id="app"></main>
<nav class="nav" id="nav"><div class="w">
  <span class="guardado" id="guardado"></span>
  <button class="btn" id="atras" type="button">Atrás</button>
  <button class="btn pri" id="sig" type="button">Siguiente</button>
</div></nav>

<script>
(function () {
  'use strict';
  const N = window.NEGOCIO || {}, PL = Invitacion.plantillas, q = new URLSearchParams(location.search);
  const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = $('#app');
  if (N.marca) { $('#marca').textContent = N.marca; document.title = 'Datos para tu invitación · ' + N.marca; }

  // ---------------------------------------------------------------------------
  // Estado (se guarda solo en este celular, también las fotos)
  // ---------------------------------------------------------------------------
  const EVS = Invitacion.EVENTOS;
  const itin = (ev) => (EVS[ev] || EVS.boda).itinerario.map(([hora, evento]) => ({ hora, evento }));
  function vacio() {
    const pq = PL[q.get('plantilla')];
    const ev = EVS[q.get('evento')] ? q.get('evento') : pq ? (pq.eventos || ['boda'])[0] : 'boda';
    return {
      paso: 0, cliente: { nombre: '', tel: '', paquete: q.get('paquete') || '', comentarios: '', cancion: '' },
      evento: ev, plantilla: PL[q.get('plantilla')] ? q.get('plantilla') : '',
      novia: '', novio: '', festejada: '', fecha: '', hora: '', ciudad: '', zona: '-06:00',
      lugar1: { tipo: EVS[ev].lugares[0], nombre: '', direccion: '', hora: '', mapa: '' },
      lugar2: { tipo: 'Recepción', nombre: '', direccion: '', hora: '', mapa: '' }, mismoLugar: !EVS[ev].lugares[1],
      padres1: '', padres2: '', padrinos: '', itinerario: itin(ev),
      vestimenta: 'Formal', notaVestimenta: '', frase: '', historia: '',
      regalos: '', sobres: true, banco: '', clabe: '', titular: '',
      portada: '', fotos: [],
      rsvpTel: '', fechaLimite: '', invitados: '', hashtag: '', nota: ''
    };
  }
  let E = vacio(), enviado = null;

  // IndexedDB: el borrador (con fotos) sobrevive si cierran la página
  const DB = { db: null,
    abrir() { return new Promise(ok => { try { const r = indexedDB.open('pedido-invitacion', 1); r.onupgradeneeded = () => r.result.createObjectStore('b'); r.onsuccess = () => { DB.db = r.result; ok(); }; r.onerror = () => ok(); } catch (e) { ok(); } }); },
    leer() { return new Promise(ok => { if (!DB.db) return ok(null); try { const r = DB.db.transaction('b').objectStore('b').get('borrador'); r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null); } catch (e) { ok(null); } }); },
    poner(v) { if (!DB.db) return; try { DB.db.transaction('b', 'readwrite').objectStore('b').put(v, 'borrador'); } catch (e) {} },
    borrar() { if (!DB.db) return; try { DB.db.transaction('b', 'readwrite').objectStore('b').delete('borrador'); } catch (e) {} }
  };
  let tGuardar;
  function guardar() {
    clearTimeout(tGuardar);
    tGuardar = setTimeout(() => { DB.poner(JSON.parse(JSON.stringify(E))); $('#guardado').textContent = '✓ Guardado en este celular'; }, 500);
  }

  /** Un solo nombre (todo menos la boda) */
  const xv = () => E.evento !== 'boda';
  const esXV = () => E.evento === 'xv';
  const EVd = () => EVS[E.evento] || EVS.boda;
  const ejemploNombre = { xv: 'Sofía', bautizo: 'Mateo', comunion: 'Regina', babyshower: 'Emilia', cumple: 'Andrea' };
  const get = (ruta) => ruta.split('.').reduce((o, k) => o == null ? o : o[k], E);
  const set = (ruta, v) => { const ks = ruta.split('.'); let o = E; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; guardar(); };

  // ---------------------------------------------------------------------------
  // Campos
  // ---------------------------------------------------------------------------
  const campo = (ruta, etq, o = {}) => `<label class="c" for="f-${ruta}">${etq}${o.req ? ' <span class="req">*</span>' : ''}${o.opc ? ' <small>(opcional)</small>' : ''}</label>
    ${o.area ? `<textarea id="f-${ruta}" data-k="${ruta}" placeholder="${esc(o.ph || '')}">${esc(get(ruta))}</textarea>`
      : `<input id="f-${ruta}" data-k="${ruta}" type="${o.tipo || 'text'}" value="${esc(get(ruta))}" placeholder="${esc(o.ph || '')}" ${o.auto ? `autocomplete="${o.auto}"` : ''} ${o.tipo === 'tel' ? 'inputmode="tel"' : ''}>`}
    ${o.ayuda ? `<p class="ayuda">${o.ayuda}</p>` : ''}`;
  const sel = (ruta, etq, ops) => `<label class="c" for="f-${ruta}">${etq}</label><select id="f-${ruta}" data-k="${ruta}">${ops.map(([v, t]) => `<option value="${esc(v)}" ${get(ruta) === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;

  function lugar(k, titulo) {
    return `<div class="caja"><h2>${titulo}</h2>
      ${campo(k + '.tipo', 'Tipo', { ph: E.evento === 'boda' ? 'Ceremonia religiosa / civil' : EVd().lugares[0] })}
      ${campo(k + '.nombre', 'Nombre del lugar', { req: k === 'lugar1', ph: k === 'lugar2' || EVd().lugares[0] !== 'Misa' && E.evento !== 'boda' ? 'Salón, jardín, casa…' : esXV() ? 'Templo de San Francisco' : 'Parroquia de San Miguel' })}
      ${campo(k + '.direccion', 'Dirección', { area: true, ph: 'Calle, número, colonia, ciudad' })}
      <div class="fila"><div>${campo(k + '.hora', 'Hora', { tipo: 'time' })}</div><div>${campo(k + '.mapa', 'Enlace de Google Maps', { tipo: 'url', opc: true, ph: 'https://maps.app.goo.gl/…' })}</div></div>
      <p class="ayuda">En Google Maps busca el lugar → Compartir → Copiar vínculo. Si no lo tienes, no pasa nada.</p>
    </div>`;
  }

  // ---------------------------------------------------------------------------
  // Pasos
  // ---------------------------------------------------------------------------
  const PASOS = [
    { t: 'Empecemos', render() {
      const pls = Object.values(PL).filter(p => Invitacion.sirvePara(p, E.evento));
      return `<p class="intro">Llena los datos de tu invitación. Toma unos 10 minutos y <b>se guarda solo</b>: puedes cerrar y seguir después desde este mismo celular. Lo que no sepas todavía, déjalo en blanco.</p>
        <div class="caja">
          ${campo('cliente.nombre', 'Tu nombre', { req: true, auto: 'name', ph: 'Nombre y apellido' })}
          ${campo('cliente.tel', 'Tu WhatsApp', { req: true, tipo: 'tel', auto: 'tel', ph: '55 1234 5678', ayuda: 'Para avisarte cuando tu invitación esté lista.' })}
          ${(N.paquetes || []).length ? sel('cliente.paquete', 'Paquete', [['', 'Todavía no lo sé'], ...N.paquetes.map(p => [p.nombre, p.nombre])]) : ''}
        </div>
        <div class="caja"><h2>¿Qué vas a celebrar?</h2>
          <div class="opc" style="margin-top:10px">
            ${Object.entries(EVS).map(([k, e]) => `<input type="radio" name="ev" id="ev-${k}" value="${k}" ${E.evento === k ? 'checked' : ''}><label for="ev-${k}">${e.emoji} ${esc(e.nombre)}</label>`).join('')}
          </div>
        </div>
        <div class="caja"><h2>Elige tu diseño</h2><p class="ayuda" style="margin-bottom:12px">Toca “Ver ejemplo” para verlo completo. Si no te decides, te ayudamos.</p>
          <div class="disenos">${pls.map(p => `<div class="dis"><input type="radio" name="pl" id="pl-${p.id}" value="${p.id}" ${E.plantilla === p.id ? 'checked' : ''}>
            <label for="pl-${p.id}"><div class="sw">${(p.colores || []).map(c => `<span style="background:${esc(c)}"></span>`).join('')}</div><b>${esc(p.nombre)}</b>
            <a href="invitacion.html?plantilla=${p.id}&evento=${E.evento}" target="_blank" rel="noopener">Ver ejemplo ↗</a></label></div>`).join('')}</div>
        </div>`;
    }, montar() {
      $$('[name=ev]').forEach(r => r.onchange = () => {
        const ev = r.value, antes = E.evento; if (ev === antes) return;
        E.evento = ev; E.plantilla = '';
        // Si no los habían cambiado, el programa y el tipo de lugar pasan a los del nuevo evento
        if (JSON.stringify(E.itinerario) === JSON.stringify(itin(antes))) E.itinerario = itin(ev);
        if (E.lugar1.tipo === EVS[antes].lugares[0]) E.lugar1.tipo = EVS[ev].lugares[0];
        if (!E.lugar2.nombre) E.mismoLugar = !EVS[ev].lugares[1];
        guardar(); pintar();
      });
      $$('[name=pl]').forEach(r => r.onchange = () => { E.plantilla = r.value; guardar(); });
    }, validar() {
      if (!E.cliente.nombre.trim()) return 'Escribe tu nombre.';
      if (String(E.cliente.tel).replace(/\D/g, '').length < 10) return 'Escribe tu WhatsApp (10 dígitos).';
    } },

    { t: () => ({ boda: 'Los novios y la fecha', xv: 'La quinceañera y la fecha', bautizo: 'El bebé y la fecha', babyshower: 'El bebé y la fecha' })[E.evento] || 'Quien celebra y la fecha', render() {
      return `<div class="caja">
          ${xv() ? campo('festejada', EVd().etqNombre, { req: true, ph: 'Como quieres que aparezca: ' + (ejemploNombre[E.evento] || 'Sofía') })
            : `<div class="fila"><div>${campo('novia', 'Nombre de la novia', { req: true, ph: 'Valeria' })}</div><div>${campo('novio', 'Nombre del novio', { req: true, ph: 'Santiago' })}</div></div>
               <p class="ayuda">Solo el nombre, como quieren que aparezca en grande.</p>`}
        </div>
        <div class="caja">
          <div class="fila"><div>${campo('fecha', 'Fecha del evento', { req: true, tipo: 'date' })}</div><div>${campo('hora', 'Hora de inicio', { tipo: 'time' })}</div></div>
          ${campo('ciudad', 'Ciudad', { ph: 'Guadalajara, Jalisco' })}
          ${sel('zona', 'Zona horaria', [['-06:00', 'Centro de México (CDMX, Guadalajara, Monterrey)'], ['-05:00', 'Quintana Roo (Cancún, Tulum)'], ['-07:00', 'Sonora, Sinaloa, Nayarit, BCS'], ['-08:00', 'Baja California (Tijuana)']])}
        </div>`;
    }, validar() {
      if (xv() ? !E.festejada.trim() : !(E.novia.trim() && E.novio.trim())) return xv() ? 'Escribe el nombre (' + EVd().etqNombre.toLowerCase() + ').' : 'Escribe los nombres de los novios.';
      if (!E.fecha) return 'Elige la fecha del evento.';
    } },

    { t: 'Lugares', render() {
      return `<p class="intro">¿Dónde será? Tus invitados tendrán un botón para llegar con Google Maps.</p>
        ${lugar('lugar1', E.evento === 'boda' ? 'Ceremonia' : EVd().lugares[0] === 'Misa' ? 'Misa o ceremonia' : 'Lugar de la fiesta')}
        <div class="caja"><label class="c" style="display:flex;gap:10px;align-items:center;margin:0;font-weight:500"><input type="checkbox" id="mismo" ${E.mismoLugar ? 'checked' : ''} style="width:22px;height:22px">Todo es en el mismo lugar</label></div>
        ${E.mismoLugar ? '' : lugar('lugar2', 'Recepción')}`;
    }, montar() { $('#mismo').onchange = (e) => { E.mismoLugar = e.target.checked; guardar(); pintar(); }; } },

    { t: 'Familia y padrinos', render() {
      return `<div class="caja">

    { t: 'Invitados y confirmaciones', render() {

  ];

  // ---------------------------------------------------------------------------
  // Convertir lo que llenó el cliente en los datos del editor
  // ---------------------------------------------------------------------------
  function invitados() {
    return String(E.invitados || '').split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const p = l.split(/\s*[|\t;]\s*/);
      let nombre = p[0], pases = parseInt(p[1], 10);
      if (p.length === 1) { const m = l.match(/^(.*?)[\s,.-]+(\d{1,2})$/); if (m) { nombre = m[1]; pases = +m[2]; } }
      return { nombre: nombre.trim(), pases: pases > 0 ? pases : 2, mesa: '' };
    }).filter(x => x.nombre);
  }
  const cuentaInv = (inv) => inv.length ? `<span class="pill">${inv.length} invitaciones</span><span class="pill">${inv.reduce((a, b) => a + b.pases, 0)} personas</span>` : '';
  function icono(t) {
    t = String(t).toLowerCase();
    return /misa|iglesia|religios|templo|parroquia/.test(t) ? 'iglesia' : /civil|boda civil|anillo/.test(t) ? 'anillos' : /c[oó]ctel|recepci/.test(t) ? 'copa' : /brindis/.test(t) ? 'brindis'
      : /cena|comida|banquete/.test(t) ? 'cena' : /vals|corona/.test(t) ? 'corona' : /zapatilla/.test(t) ? 'zapatilla' : /bail|m[uú]sica|fiesta|dj/.test(t) ? 'musica'
      : /pastel/.test(t) ? 'pastel' : /foto/.test(t) ? 'foto' : /fin|cierre|despedida/.test(t) ? 'luna' : 'corazon';
  }
  const lineas = (s) => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
  function armar() {
    const ev = E.evento, base = Invitacion.normalizar({ evento: ev });
    const pref = PL[EVS[ev].plantilla];
    const pl = PL[E.plantilla] && Invitacion.sirvePara(PL[E.plantilla], ev) ? E.plantilla : (pref && Invitacion.sirvePara(pref, ev) ? pref : Object.values(PL).find(p => Invitacion.sirvePara(p, ev))).id;
    const L = (l, icono) => ({ tipo: l.tipo || '', hora: l.hora || '', nombre: l.nombre || '', direccion: l.direccion || '', mapa: l.mapa || '', icono });
    const lugares = [L(E.lugar1, /misa|iglesia|ceremonia|templo|parroquia|religios/i.test(E.lugar1.tipo) ? 'iglesia' : 'hacienda')];
    if (!E.mismoLugar && E.lugar2.nombre) lugares.push(L(E.lugar2, 'hacienda'));
    const ops = lineas(E.regalos).map(l => { const [n, ...r] = l.split(':'); return { nombre: n.trim(), detalle: r.join(':').trim(), enlace: /^https?:\/\//.test(r.join(':').trim()) ? r.join(':').trim() : '', icono: /amazon|tienda/i.test(n) ? 'bolsa' : 'regalo' }; });
    if (E.sobres) ops.push({ nombre: 'Lluvia de sobres', detalle: 'El día del evento', enlace: '', icono: 'sobre' });
    const tel = String(E.rsvpTel || E.cliente.tel || '').replace(/\D/g, '');
    const datos = {
      evento: ev, plantilla: pl,
      novia: ev !== 'boda' ? '' : E.novia.trim(), novio: ev !== 'boda' ? '' : E.novio.trim(), festejada: ev !== 'boda' ? E.festejada.trim() : '',
      fecha: E.fecha, hora: E.hora || E.lugar1.hora || EVS[ev].itinerario[0][0], zonaHoraria: E.zona, ciudad: E.ciudad,
      introPortada: base.introPortada, frase: E.frase, padresNovia: E.padres1, padresNovio: ev !== 'boda' ? '' : E.padres2,
      padrinos: lineas(E.padrinos).map(l => { const i = l.indexOf(':'); return i > 0 ? { rol: l.slice(0, i).trim(), nombres: l.slice(i + 1).trim() } : { rol: 'Padrinos', nombres: l }; }),
      itinerario: E.itinerario.filter(x => x.evento).map(x => ({ hora: x.hora, evento: x.evento, detalle: '', icono: icono(x.evento) })),
      lugares,
      vestimenta: { tipo: E.vestimenta, texto: '', colores: [], nota: E.notaVestimenta },
      historia: { titulo: base.historia.titulo, texto: E.historia, fotos: E.fotos.map(f => ({ src: f.src, pie: f.pie })) },
      regalos: { titulo: base.regalos.titulo, texto: ops.length || E.clabe ? (EVS[ev].voz === 'yo' ? 'pero si deseas obsequiarme algo, aquí algunas opciones' : 'pero si deseas obsequiarnos algo, aquí algunas opciones') : '', opciones: ops, banco: E.banco, titular: E.titular, clabe: String(E.clabe || '').replace(/\D/g, '') },
      fotoPortada: E.portada,
      rsvp: { whatsapp: tel ? (tel.length === 10 ? '521' + tel : tel) : '', fechaLimite: E.fechaLimite, pases: 2, texto: '' },
      invitados: invitados(), hashtag: E.hashtag, nota: E.nota, musica: 'melodia'
    };
    return { tipo: 'pedido-invitacion', version: 1, creado: new Date().toISOString(),
      titulo: ev === 'boda' ? `${datos.novia} & ${datos.novio}` : `${EVS[ev].nombre} de ${datos.festejada}`, eventoNombre: EVS[ev].nombre,
      cliente: { nombre: E.cliente.nombre.trim(), tel: E.cliente.tel, paquete: E.cliente.paquete, cancion: E.cliente.cancion, comentarios: E.cliente.comentarios },
      datos };
  }

  // ---------------------------------------------------------------------------
  // Pago del anticipo (Mercado Pago o transferencia + comprobante)
  // ---------------------------------------------------------------------------
  const PAGO = N.pago || {};
  const dinero = (n) => '$' + Math.round(n).toLocaleString('es-MX') + ' ' + (N.moneda || 'MXN');
  function anticipoDe(paquete) {
    const p = (N.paquetes || []).find(x => x.nombre === paquete), a = String(N.anticipo || '');
    if (!p || !p.precio) return null;
    const pct = /^(\d+(?:\.\d+)?)\s*%$/.exec(a.trim()), fijo = /^\$?\s*([\d,]+)/.exec(a.trim());
    return { paquete: p, monto: pct ? p.precio * +pct[1] / 100 : fijo ? +fijo[1].replace(/,/g, '') : p.precio, texto: pct ? `${a} de ${p.nombre} (${dinero(p.precio)})` : `paquete ${p.nombre}` };
  }
  const hayPago = (paquete) => { const p = (N.paquetes || []).find(x => x.nombre === paquete) || {}; return !!(p.linkPago || PAGO.mercadoPago || PAGO.clabe); };
  function vistaPago(folio, paquete) {
    if (!hayPago(paquete)) return '';
    const an = anticipoDe(paquete), link = ((N.paquetes || []).find(x => x.nombre === paquete) || {}).linkPago || PAGO.mercadoPago;
    const clabe = String(PAGO.clabe || '').replace(/\s/g, '');
    return `<div class="caja pago" id="pago"><h2>💳 Aparta tu fecha</h2>
      <p class="ayuda">Tu invitación se empieza a hacer cuando recibimos el anticipo.</p>
      ${an ? `<p class="monto">${dinero(an.monto)}</p><p class="ayuda">Anticipo: ${esc(an.texto)}</p>` : ''}
      ${link ? `<div class="opcion"><b>Con tarjeta o en OXXO</b><a class="btn mp" href="${esc(link)}" target="_blank" rel="noopener">Pagar con Mercado Pago</a></div>` : ''}
      ${clabe ? `<div class="opcion"><b>Por transferencia</b><dl>${PAGO.banco ? `<dt>Banco</dt><dd>${esc(PAGO.banco)}</dd>` : ''}<dt>CLABE</dt><dd>${esc(clabe.replace(/(\d{4})(?=\d)/g, '$1 '))}</dd>${PAGO.titular ? `<dt>A nombre de</dt><dd>${esc(PAGO.titular)}</dd>` : ''}${folio ? `<dt>Concepto</dt><dd>${esc(folio)}</dd>` : ''}</dl>
        <button class="btn" type="button" id="copiar-clabe">Copiar CLABE</button>
        ${PAGO.nota ? `<p class="ayuda" style="margin-top:8px">${esc(PAGO.nota)}</p>` : ''}</div>` : ''}
      <div class="opcion"><b>¿Ya pagaste?</b><p class="ayuda">Sube la foto o captura de tu comprobante (o del pago en OXXO).</p>
        <input type="file" id="comprobante" accept="image/*,application/pdf" hidden>
        <button class="btn" type="button" id="subir-comp">📎 Subir comprobante</button>
        <p class="estado" id="comp-estado" role="status"></p></div></div>`;
  }
  function montarPago(folio, quien) {
    const c = $('#copiar-clabe');
    if (c) c.onclick = () => navigator.clipboard.writeText(String(PAGO.clabe || '').replace(/\s/g, '')).then(() => { c.textContent = 'CLABE copiada ✓'; });
    const inp = $('#comprobante'), b = $('#subir-comp'), est = $('#comp-estado');
    if (!inp) return;
    const marcar = (t, ok) => { est.textContent = t; est.className = 'estado ' + (ok ? 'ok' : 'mal'); };
    const porWa = () => { const wa = String(N.whatsapp || '').replace(/\D/g, ''); if (wa) window.open(`https://wa.me/${wa}?text=${encodeURIComponent(`¡Hola! Soy ${quien || 'tu cliente'}. Te mando mi comprobante del anticipo${folio ? ' (folio ' + folio + ')' : ''}.`)}`, '_blank'); };
    b.onclick = () => inp.click();
    inp.onchange = async () => {
      const f = inp.files[0]; inp.value = ''; if (!f) return;
      if (!url || !folio) { marcar('Mándanos la foto de tu comprobante por WhatsApp.', true); porWa(); return; }
      b.disabled = true; marcar('Subiendo comprobante…', true);
      try {
        let archivo;
        if (/^image\//.test(f.type) && !/heic/i.test(f.type)) archivo = await reducir(f);
        else {
          if (f.size > 10e6) throw new Error('El archivo pesa más de 10 MB');
          archivo = await new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(f); });
        }
        const r = await (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'comprobante', pedido: folio, archivo }) })).json();
        if (!r.ok) throw new Error(r.error || 'error');
        marcar('✓ Recibimos tu comprobante. Te confirmamos por WhatsApp en cuanto lo veamos.', true);
        b.textContent = 'Subir otro comprobante';
      } catch (e) { marcar('No se pudo subir (' + (e.message || 'sin conexión') + '). Mándalo por WhatsApp, por favor.', false); porWa(); }
      b.disabled = false;
    };
  }

  /** Reduce la foto para que el envío sea rápido. */
  function reducir(file) {
    return new Promise((ok, mal) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => { const k = Math.min(1, 1600 / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8)); };
      im.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo leer la foto')); };
      im.src = url;
    });
  }

  // ---------------------------------------------------------------------------
  // Navegación
  // ---------------------------------------------------------------------------
  let error = '';
  function pintar() {
    if (enviado) return pintarListo();
    const n = E.paso, P = PASOS[n], t = typeof P.t === 'function' ? P.t() : P.t;
    app.innerHTML = `<p class="paso-n">Paso ${n + 1} de ${PASOS.length}</p><h1>${esc(t)}</h1>${error ? `<p class="error" role="alert">${esc(error)}</p>` : ''}${P.render()}`;
    $('#paso-txt').textContent = `${n + 1} / ${PASOS.length}`;
    $('#barra').style.width = ((n + 1) / PASOS.length * 100) + '%';
    $('#atras').style.visibility = n ? 'visible' : 'hidden';
    $('#sig').textContent = n === PASOS.length - 1 ? 'Enviar mis datos' : 'Siguiente';
    $$('[data-k]', app).forEach(i => i.addEventListener('input', () => set(i.dataset.k, i.value)));
    if (P.montar) P.montar();
  }
  function irA(n) { error = ''; E.paso = Math.max(0, Math.min(PASOS.length - 1, n)); guardar(); pintar(); window.scrollTo({ top: 0 }); }
  $('#atras').onclick = () => irA(E.paso - 1);
  $('#sig').onclick = () => {
    const P = PASOS[E.paso], e = P.validar && P.validar();
    if (e) { error = e; pintar(); window.scrollTo({ top: 0 }); return; }
    if (E.paso === PASOS.length - 1) return enviar();
    irA(E.paso + 1);
  };

  // ---------------------------------------------------------------------------
  // Envío
  // ---------------------------------------------------------------------------
  const url = N.hojaConfirmaciones || '';
  async function enviar() {
    for (let i = 0; i < PASOS.length - 1; i++) { const e = PASOS[i].validar && PASOS[i].validar(); if (e) { E.paso = i; error = e; pintar(); window.scrollTo({ top: 0 }); return; } }
    const p = armar();
    if (!url) { enviado = { sinHoja: true, p }; return pintar(); }
    const b = $('#sig'); b.disabled = true; b.textContent = 'Enviando…';
    try {
      const r = await (await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) })).json();
      if (!r.ok) throw new Error(r.error || 'error');
      enviado = { folio: r.pedido, p }; DB.borrar(); pintar();
    } catch (err) {
      b.disabled = false; b.textContent = 'Enviar mis datos';
      enviado = { fallo: true, p }; pintar();
    }
  }
  function archivo(p) { return new File([JSON.stringify(p)], `pedido-${(p.cliente.nombre || 'invitacion').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').toLowerCase()}.json`, { type: 'application/json' }); }
  function pintarListo() {
    const p = enviado.p, wa = String(N.whatsapp || '').replace(/\D/g, '');
    $('#nav').hidden = true; $('#barra').style.width = '100%'; $('#paso-txt').textContent = '';
    const quien = p.datos.evento && p.datos.evento !== 'boda' ? `${(EVS[p.datos.evento] || {}).nombre} de ${p.datos.festejada}` : `${p.datos.novia} & ${p.datos.novio}`;
    const msg = `¡Hola! Soy ${p.cliente.nombre}. ${enviado.folio ? `Ya envié los datos de mi invitación (${quien}). Folio: ${enviado.folio}` : `Te mando el archivo con los datos de mi invitación (${quien}).`}`;
    app.innerHTML = enviado.folio ? `<div class="listo"><div class="ico">✓</div><h1>¡Listo, ${esc(p.cliente.nombre.split(' ')[0])}!</h1>
        <p class="intro">Recibimos los datos de tu invitación. Te escribiremos por WhatsApp cuando esté lista para revisarla.</p>
        <p>Tu folio:</p><p class="folio">${esc(enviado.folio)}</p>
        <div class="acciones">${wa ? `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">Avisar por WhatsApp</a>` : ''}</div>
        ${vistaPago(enviado.folio, p.cliente.paquete)}</div>`
      : `<div class="listo"><div class="ico" style="background:var(--accent-bg);color:var(--accent)">✉</div><h1>Ya casi</h1>
        ${enviado.fallo ? '<p class="error">No pudimos enviarlo por internet. No te preocupes: tus datos están guardados.</p>' : ''}
        <p class="intro">Manda el archivo con tus datos por WhatsApp${N.whatsapp ? '' : ' a quien hace tu invitación'}. Incluye tus fotos.</p>
        <div class="acciones">
          <button class="btn wa" type="button" id="compartir">Compartir archivo por WhatsApp</button>
          <button class="btn" type="button" id="bajar">Descargar archivo</button>
          ${enviado.fallo ? '<button class="btn" type="button" id="reintentar">Intentar enviar otra vez</button>' : ''}
          <button class="btn" type="button" id="volver">Volver a revisar</button>
        </div>
        <p class="ayuda" style="margin-top:14px">Si “Compartir” no funciona en tu celular, toca “Descargar archivo” y mándalo como documento por WhatsApp${wa ? ` al ${esc(N.whatsapp)}` : ''}.</p></div>`;
    const bajar = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(archivo(p)); a.download = archivo(p).name; document.body.append(a); a.click(); a.remove(); };
    const c = $('#compartir'); if (c) c.onclick = async () => {
      const f = archivo(p);
      if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], text: msg }); return; } catch (e) { if (e.name === 'AbortError') return; } }
      bajar(); if (wa) window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg + ' (te lo adjunto como documento)')}`, '_blank');
    };
    const d = $('#bajar'); if (d) d.onclick = bajar;
    montarPago(enviado.folio, p.cliente.nombre);
    const r = $('#reintentar'); if (r) r.onclick = () => { enviado = null; $('#nav').hidden = false; E.paso = PASOS.length - 1; pintar(); enviar(); };
    const v = $('#volver'); if (v) v.onclick = () => { enviado = null; $('#nav').hidden = false; pintar(); };
  }

  // ---------------------------------------------------------------------------
  // Inicio: recupera el borrador si existe
  // ---------------------------------------------------------------------------
  // Enlace de pago que manda el administrador: pedido.html?pagar=FOLIO&paquete=Premium
  if (q.get('pagar')) {
    $('#nav').hidden = true; $('#barra').style.width = '100%'; $('#paso-txt').textContent = '';
    const folio = q.get('pagar').replace(/[^\w-]/g, '').slice(0, 30);
    app.innerHTML = `<div class="listo" style="padding-top:10px"><h1>Pago de tu invitación</h1><p>Folio:</p><p class="folio">${esc(folio)}</p>
      ${vistaPago(folio, q.get('paquete') || '') || `<p class="intro">Escríbenos por WhatsApp para darte los datos de pago.</p>`}</div>`;
    montarPago(folio, '');
    return;
  }
  DB.abrir().then(DB.leer).then(b => {
    if (b && b.cliente) { E = Object.assign(vacio(), b); if (E.paso) $('#guardado').textContent = '✓ Seguimos donde te quedaste'; }
    pintar();
  });
})();
</script>
</body>
</html>
